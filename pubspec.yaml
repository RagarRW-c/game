name: triple_tile_adventure
description: A complete colorful Flutter triple-tile puzzle game for Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.2
  video_player: 2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  video_player_platform_interface: ^6.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/levels/
    - assets/audio/
    - assets/audio/triotrek/music/
    - assets/audio/triotrek/sfx/
    - assets/tiles/approved/
    - assets/ui/coastal/
    - assets/ui/victory_premium/
    - assets/video/triotrek/cat_victory_android_audio.mp4
